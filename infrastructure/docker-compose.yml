# ZERO - Infrastructure Docker Compose
# 
# ATENÇÃO: Este é um ambiente de DESENVOLVIMENTO.
# Para produção, usar configurações hardened separadas.
#
# SEGURANÇA:
# - Secrets via Docker secrets em produção
# - Networks isolados
# - Volumes persistentes criptografados
# - Health checks obrigatórios

services:
  # ===========================================================================
  # PostgreSQL - Banco de Dados Principal
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: zero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zero_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-zero}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - zero-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zero_dev} -d ${POSTGRES_DB:-zero}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=5
      -c log_statement=all
      -c log_duration=on
    deploy:
      resources:
        limits:
          memory: 1G

  # ===========================================================================
  # Redis - Cache e Rate Limiting
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: zero-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_this_redis_password} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - zero-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  # MinIO - S3-compatible Object Storage (desenvolvimento)
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: zero-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_this_minio_password}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - zero-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # ===========================================================================
  # Create MinIO bucket on startup
  # ===========================================================================
  minio-init:
    image: minio/mc:latest
    container_name: zero-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_this_minio_password}
    networks:
      - zero-network
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set zero http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb zero/documents --ignore-existing;
      mc mb zero/backups --ignore-existing;
      mc anonymous set none zero/documents;
      mc anonymous set none zero/backups;
      exit 0;
      "

networks:
  zero-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
